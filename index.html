<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>آلة حاسبة ذكية</title>
    <style>
        body { 
            font-family: Tahoma, sans-serif; 
            text-align: center; 
            margin-top: 40px; 
            background: #1e1e1e; 
            color: white;
        }
        .calc { 
            background: #2d2d2d; 
            padding: 20px; 
            display: inline-block; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
        }
        #display { 
            width: 240px; 
            height: 50px; 
            font-size: 24px; 
            text-align: left; 
            direction: ltr;
            margin-bottom: 15px; 
            background: #111; 
            color: #0fff50; 
            border: 2px solid #444; 
            border-radius: 8px;
            padding: 0 10px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 60px);
            gap: 8px;
        }
        button { 
            height: 60px; 
            font-size: 20px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background: #444; 
            color: white;
            transition: 0.2s;
        }
        button:hover { background: #555; }
        .operator { background: #ff9500; }
        .operator:hover { background: #ffaa33; }
        .equal { background: #34c759; grid-column: span 2; }
        .equal:hover { background: #4cd964; }
        .clear { background: #ff3b30; }
        .clear:hover { background: #ff5247; }
    </style>
</head>
<body>

    <div class="calc">
        <input type="text" id="display" readonly>
        <div class="buttons">
            <button class="clear" onclick="clearCalc()">C</button>
            <button class="operator" onclick="press('÷')">÷</button>
            <button class="operator" onclick="press('×')">×</button>
            <button class="operator" onclick="press('-')">-</button>
            
            <button onclick="press('7')">7</button>
            <button onclick="press('8')">8</button>
            <button onclick="press('9')">9</button>
            <button class="operator" onclick="press('+')">+</button>
            
            <button onclick="press('4')">4</button>
            <button onclick="press('5')">5</button>
            <button onclick="press('6')">6</button>
            <button onclick="press('1')">1</button>
            
            <button onclick="press('2')">2</button>
            <button onclick="press('3')">3</button>
            <button onclick="press('0')">0</button>
            <button onclick="press('.')">.</button>
            
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        function press(val) {
            document.getElementById('display').value += val;
        }

        function clearCalc() {
            document.getElementById('display').value = '';
        }

        function calculate() {
            var val = document.getElementById('display').value;
            
            // كلمة السر السرية
            if (val === '0000') {
                window.location.href = 'https://www.poki.com';
            } else {
                try {
                    // استبدال الرموز المرئية برموز يفهمها الجافاسكريبت للحساب
                    var computeVal = val.replace(/×/g, '*').replace(/÷/g, '/');
                    document.getElementById('display').value = eval(computeVal);
                } catch (e) {
                    document.getElementById('display').value = 'خطأ';
                }
            }
        }
    </script>

</body>
</html>
